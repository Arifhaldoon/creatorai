name: Build CreatorAI for Windows

on:
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  build-windows:
    runs-on: windows-latest

    steps:
      - name: Download source code
        uses: actions/checkout@v4

      - name: Install Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install PyInstaller
        run: |
          python -m pip install --upgrade pip
          python -m pip install pyinstaller

      - name: Build CreatorAI
        run: |
          pyinstaller --noconfirm --clean --onefile --windowed --name CreatorAI app/creator_ai.py

      - name: Create portable package
        shell: powershell
        run: |
          New-Item -ItemType Directory -Force -Path release
          Copy-Item dist\CreatorAI.exe release\CreatorAI.exe

      - name: Upload CreatorAI Windows build
        uses: actions/upload-artifact@v4
        with:
          name: CreatorAI-Windows
          path: release/CreatorAI.exe
          if-no-files-found: error
